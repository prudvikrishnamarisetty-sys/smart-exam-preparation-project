# Render.com Deployment Configuration for SmartExam Pro Backend
# This file tells Render how to start your FastAPI server.

services:
  - type: web
    name: smartexam-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
